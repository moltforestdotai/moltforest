name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check and test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Integration tests skip themselves without a database.
      - run: pnpm test

  indexer:
    name: Type-check and test (indexer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm test

  contracts:
    name: Build and test (contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: forge soldeer install
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      # The indexer and @moltforest/chain use the committed ABI; it must match the contract.
      - name: Committed ABI matches the contract
        run: forge inspect src/ReceiptRegistry.sol:ReceiptRegistry abi --json | diff - ../apps/indexer/abis/ReceiptRegistry.json

  deploy:
    name: Deploy to production
    needs: [checks, indexer, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Server details live in repository secrets, never in the repo. On the
      # server this key is restricted to a deploy command that accepts only
      # "deploy <sha>" for a commit on main.
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings -> Secrets and variables -> Actions)"
              exit 1
            fi
          done
          # Values pasted on Windows can carry CR characters, which break SSH parsing.
          host="$(printf '%s' "$VPS_HOST" | tr -d '\r' | xargs)"
          user="$(printf '%s' "$VPS_USER" | tr -d '\r' | xargs)"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid private key (paste the whole file, BEGIN and END lines included)"
            exit 1
          fi
          # Pinned server host key (secret VPS_KNOWN_HOSTS: the known_hosts line).
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::VPS_KNOWN_HOSTS is not a valid known_hosts line"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$user@$host" "deploy $GITHUB_SHA"
