name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check and test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Integration tests skip themselves without a database.
      - run: pnpm test

  indexer:
    name: Type-check and test (indexer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Deploy to production
    needs: [checks, indexer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # The key's authorized_keys entry forces scripts/deploy/remote-deploy.sh,
      # so this connection can only deploy a commit that is on main.
      # Only the known_hosts file is needed from the repo.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy/known_hosts
          sparse-checkout-cone-mode: false
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings -> Secrets and variables -> Actions)"
              exit 1
            fi
          done
          # Values pasted on Windows can carry CR characters, which break SSH parsing.
          host="$(printf '%s' "$VPS_HOST" | tr -d '\r' | xargs)"
          user="$(printf '%s' "$VPS_USER" | tr -d '\r' | xargs)"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid private key (paste the whole file, BEGIN and END lines included)"
            exit 1
          fi
          # The server's host key is public and pinned in the repo.
          cp scripts/deploy/known_hosts ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$user@$host" "deploy $GITHUB_SHA"
