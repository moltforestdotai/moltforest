[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy scripts write broadcast records; testnet ones are committed as the deployment log.
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 120

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.4.0"

[soldeer]
remappings_generate = false
remappings_location = "txt"
recursive_deps = false
